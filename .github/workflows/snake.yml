name: Generate Snake
on:
  schedule:
    - cron: "0 */12 * * *"   # twice a day
  workflow_dispatch:          # lets you run it manually
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: 9Sura
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark
            dist/snake.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9

      - name: Crop off the stack bar
        run: |
          for f in dist/*.svg; do
          python3 - "$f" <<'PY'
          import re, sys
          p = sys.argv[1]
          s = open(p).read()
          m = re.search(r'viewBox="0 0 ([\d.]+) ([\d.]+)"', s)
          w, h = float(m.group(1)), float(m.group(2))
          newh = h - 36           # stack band height; tune 32-40 if needed
          s = s.replace(m.group(0), f'viewBox="0 0 {w} {newh}"')
          s = re.sub(r'(<svg[^>]*?)height="[\d.]+"', rf'\1height="{newh}"', s, count=1)
          open(p, 'w').write(s)
          PY
          done

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
