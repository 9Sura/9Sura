name: Generate Snake
on:
  schedule:
    - cron: "0 */12 * * *"   # twice a day
  workflow_dispatch:          # lets you run it manually
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: 9Sura
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      - name: Crop off the stack bar
        run: |
          for f in dist/*.svg; do
          python3 - "$f" <<'PY'
          import re, sys
          p = sys.argv[1]
          s = open(p).read()
          tag = re.search(r'<svg[^>]*>', s).group(0)
          print("BEFORE:", tag)
          CROP = 36  # stack band height to remove; tune 32-40
          vb = re.search(r'viewBox="([\d.\-]+) ([\d.\-]+) ([\d.\-]+) ([\d.\-]+)"', s)
          if vb:
              x, y, w, h = (float(vb.group(i)) for i in range(1, 5))
              s = s.replace(vb.group(0), f'viewBox="{x} {y} {w} {h - CROP}"')
          hm = re.search(r'(<svg[^>]*?height=")([\d.]+)(px)?(")', s)
          if hm:
              s = s.replace(hm.group(0), f'{hm.group(1)}{float(hm.group(2)) - CROP}{hm.group(3) or ""}{hm.group(4)}')
          open(p, 'w').write(s)
          print("AFTER: ", re.search(r'<svg[^>]*>', s).group(0))
          PY
          done

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
